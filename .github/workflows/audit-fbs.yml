name: Temporary FBS experiment
on:
  push:
    branches:
      - improve/fbs-matchup-audit
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch full history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python fetch_cfbd.py --seasons 2014-2026
      - uses: actions/upload-artifact@v4
        with:
          name: raw-experiment-data
          path: |
            data/raw/advanced_raw.parquet
            data/derived/games_base.parquet
          retention-days: 3
      - run: python features.py
      - run: python -m unittest discover -s tests -v
      - run: python audit_fbs.py
      - run: python experiment_fbs.py
