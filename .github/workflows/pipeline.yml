name: Run weekly pipeline

# Does everything: fetch data -> build features -> train + backtest ->
# predict this week's games.txt -> pull news -> publish results to the site.
on:
  push:
    branches: [release/accuracy-policy]
    paths:
      - .github/workflows/pipeline.yml
      - prediction_policy.py
      - predict.py
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons of data to train on"
        default: "2014-2026"
        required: true

permissions:
  contents: write   # lets the job commit predictions back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate prediction and archival policy
        run: python -m unittest discover -s tests -v

      - name: Fetch data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python fetch_cfbd.py --seasons "${{ github.event.inputs.seasons || '2014-2026' }}"

      - name: Grade archived picks with final scores
        run: python grade_results.py

      - name: Build features
        run: python features.py

      - name: Test final blend on season-forward FBS forecasts
        run: python policy_audit.py

      - name: Train + backtest (prints the report card)
        run: python train_and_backtest.py

      - name: Predict this week's slate
        run: python predict.py

      - name: Build upset watch from the same predictions
        run: python upset_watch.py

      - name: Pull news headlines
        run: python news.py

      - name: Save measured policy report
        uses: actions/upload-artifact@v4
        with:
          name: live-policy-audit
          path: data/derived/policy_audit.json

      - name: Publish results to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only the files that were actually produced.
          for f in docs/predictions.json docs/upset_watch.json docs/news.json docs/team_stats.json docs/results.json; do
            [ -f "$f" ] && git add "$f"
          done
          git add historicals/predictions/
          [ ! -d historicals/revisions ] || git add historicals/revisions/
          git commit -m "weekly update: predictions + news" || echo "nothing to commit"
          git push
